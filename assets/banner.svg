<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Raúl - Data Analyst | BI Enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#16123a"/>
      <stop offset="1" stop-color="#0d2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="240" rx="14" fill="url(#bg)"/>

  <!-- Red de nodos: conexiones -->
  <g stroke="url(#line)" stroke-width="1.2" opacity="0.35" fill="none">
    <line x1="620" y1="50" x2="700" y2="130"/>
    <line x1="700" y1="130" x2="780" y2="60"/>
    <line x1="780" y1="60" x2="850" y2="150"/>
    <line x1="850" y1="150" x2="930" y2="70"/>
    <line x1="700" y1="130" x2="760" y2="200"/>
    <line x1="760" y1="200" x2="650" y2="190"/>
    <line x1="650" y1="190" x2="560" y2="120"/>
    <line x1="560" y1="120" x2="620" y2="50"/>
    <line x1="780" y1="60" x2="880" y2="30"/>
    <line x1="880" y1="30" x2="930" y2="70"/>
    <line x1="850" y1="150" x2="960" y2="170"/>
    <line x1="930" y1="70" x2="960" y2="170"/>
    <line x1="560" y1="120" x2="520" y2="40"/>
    <line x1="520" y1="40" x2="620" y2="50"/>
    <line x1="650" y1="190" x2="600" y2="215"/>
    <line x1="600" y1="215" x2="760" y2="200"/>
    <line x1="700" y1="130" x2="650" y2="190"/>
  </g>

  <!-- Red de nodos: puntos con pulso suave -->
  <g fill="url(#accent)">
    <circle cx="620" cy="50" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="130" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="60" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="150" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="70" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="200" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="190" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="120" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="30" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="170" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="40" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="215" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Texto -->
  <text x="60" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#c9d1e8">👋 Hi, I'm</text>
  <text x="58" y="148" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="url(#accent)">Raúl</text>
  <text x="60" y="188" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff">Data Analyst | BI Enthusiast</text>
  <text x="60" y="218" font-family="Consolas, 'SFMono-Regular', 'Courier New', monospace" font-size="15" fill="#22d3ee" opacity="0.85">SELECT insight FROM data;</text>
</svg>
