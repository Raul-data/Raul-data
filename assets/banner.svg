<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Raúl - Data Analyst | BI Enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="240" rx="14" fill="#0a0a0a"/>

  <!-- Cuadrícula -->
  <g stroke="#1f1f1f" stroke-width="1">
    <line x1="520" y1="40" x2="965" y2="40"/>
    <line x1="520" y1="80" x2="965" y2="80"/>
    <line x1="520" y1="120" x2="965" y2="120"/>
    <line x1="520" y1="160" x2="965" y2="160"/>
  </g>
  <line x1="520" y1="200" x2="965" y2="200" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Barras -->
  <g fill="#232323">
    <rect x="540" y="160" width="24" height="40"/>
    <rect x="582" y="130" width="24" height="70"/>
    <rect x="624" y="145" width="24" height="55"/>
    <rect x="666" y="105" width="24" height="95"/>
    <rect x="708" y="120" width="24" height="80"/>
    <rect x="750" y="80" width="24" height="120"/>
    <rect x="792" y="100" width="24" height="100"/>
    <rect x="834" y="60" width="24" height="140"/>
    <rect x="876" y="75" width="24" height="125"/>
  </g>
  <rect x="918" y="40" width="24" height="160" fill="#e10600"/>

  <!-- Línea de tendencia -->
  <polyline points="552,160 594,130 636,145 678,105 720,120 762,80 804,100 846,60 888,75 930,40"
            fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
            stroke-dasharray="600" stroke-dashoffset="600">
    <animate attributeName="stroke-dashoffset" values="600;0;0" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
  </polyline>
  <g fill="#ffffff">
    <circle cx="552" cy="160" r="3.5"/>
    <circle cx="594" cy="130" r="3.5"/>
    <circle cx="636" cy="145" r="3.5"/>
    <circle cx="678" cy="105" r="3.5"/>
    <circle cx="720" cy="120" r="3.5"/>
    <circle cx="762" cy="80" r="3.5"/>
    <circle cx="804" cy="100" r="3.5"/>
    <circle cx="846" cy="60" r="3.5"/>
    <circle cx="888" cy="75" r="3.5"/>
  </g>
  <circle cx="930" cy="40" r="5" fill="#ffffff">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Texto -->
  <text x="60" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#bdbdbd">Hi, I'm</text>
  <text x="58" y="148" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff">Raúl</text>
  <rect x="60" y="164" width="64" height="4" fill="#e10600"/>
  <text x="60" y="198" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="#ffffff">DATA ANALYST | BI ENTHUSIAST</text>
  <text x="60" y="222" font-family="Consolas, 'SFMono-Regular', 'Courier New', monospace" font-size="15" fill="#e10600">SELECT insight FROM data;</text>
</svg>
